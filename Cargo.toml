[package]
name = "echo"
version = "0.1.10"
edition = "2021"

[dependencies]
# UI Framework
# FemtoVG's glyph-atlas rendering makes small text uneven on Windows. Keep it
# out of the build so new windows use the same hinted Skia text renderer.
# Prefer Skia's OpenGL surface: Windows DX12 presents transparent pixels black.
# Keep regular Skia enabled for its automatic fallback when GL is unavailable.
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "renderer-skia-opengl", "renderer-software", "accessibility", "raw-window-handle-06", "compat-1-2"] }
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
pulldown-cmark = { version = "=0.13.0", default-features = false }
rfd = "=0.17.2"
arboard = "3.3"

# User configuration directories
dirs-next = "2.0"

# Async Runtime
tokio = { version = "1.36", features = ["full"] }

# Audio
cpal = "0.15"
rubato = "0.14" # High-quality resampling
signalsmith-stretch = "=0.1.3" # Continuous, pitch-preserving speech tempo
pocket-tts = "=0.6.2"
candle-core = "=0.9.2"
hound = "=3.5.1"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "symphonia-mp3"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
crossbeam-channel = "0.5"
raw-window-handle = "0.6"
bzip2 = "0.4"
tar = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

# Networking
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonschema = { version = "=0.58.6", default-features = false }
semver = { version = "1.0", features = ["serde"] }
minisign-verify = "0.2.5"
url = "2.5"
futures-util = "0.3"
base64 = "0.22"
http = "1.1"

# HTTP client for updates and model downloads
reqwest = { version = "0.12", features = ["json", "native-tls", "stream"] }

# Logging & Error Handling
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
chrono = "0.4.44"
chrono-tz = "0.10"
oauth2 = { version = "5.0", default-features = false }
webbrowser = "1.2"
rusqlite = { version = "0.38", features = ["bundled"] }
num_cpus = "1.16"
sha2 = "0.10"
sherpa-onnx = "=1.13.4"
text2num = "=2.8.0"
regex = "1"
rig-core = "0.42"
reqwest_rig = { version = "0.13", package = "reqwest", default-features = false, features = ["rustls"] }
bytes = "1"
getrandom = "=0.3.4"

# System Integration
[target.'cfg(windows)'.dependencies]
tray-icon = "0.14"
global-hotkey = "0.5"
tao = "0.28" # Event loop for tray/hotkeys
winreg = "0.52"
windows = { version = "0.54", features = [
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Com", 
    "Win32_Media_Audio", # For WASAPI notifications
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects"
] }

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1"

# Ultra verifies several GB before loading. Keep checksum compression fast in
# source builds while retaining debug information for application code.
[profile.dev.package.sha2]
opt-level = 3

# Selection/scrolling traverse the renderer's font, Unicode, geometry, and raster
# dependencies too. Optimize dependencies for cargo run, keeping Echo itself
# unoptimized with normal debug information. The explicit SHA-256 override wins.
[profile.dev.package."*"]
opt-level = 2
